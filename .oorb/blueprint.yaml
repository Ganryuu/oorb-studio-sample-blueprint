# .oorb/blueprint.yaml — OORB Studio Blueprint Manifest v1
#
# This file is what makes a repo a Blueprint.
# Studio reads it on import. Local users read it for setup context.
# Everything else in the repo is standard ROS 2 / robotics project files.

oorb_blueprint: "1.0"

# ─── Identity ───
# Technical identity only. All marketplace display content lives in listing.yaml.
meta:
  name: "4-DOF Robot Arm"
  slug: "4dof-robot-arm"
  version: "0.1.0"
  license: "MIT"
  ros_distro: "jazzy"
  robot_type: "arm"                    # mobile_base | quadruped | arm | drone | custom
  # Attribution chain — set automatically when forking a Blueprint
  # forked_from:
  #   slug: "oorb-studio/seed-arm"
  #   version: "1.0.0"
  #   url: "https://oorb.io/blueprints/seed-arm"

# ─── Marketplace Listing ───
listing: ".oorb/listing.yaml"

# ─── Blueprint Inheritance ───
# Extend a base Blueprint instead of starting from scratch.
# Inherited fields are merged — override only what you change.
# extends: "oorb-studio/seed-arm"
# override:
#   sim.default_scene: "sim/models/mjcf/my_robot.xml"
#   dependencies.pip:
#     - torch>=2.0
#     - stable-baselines3

# ─── Container Resources ───
resources:
  cpu: 2
  ram_gb: 4
  storage_gb: 10
  gpu: false

# ─── Dependencies ───
# Exact versions for reproducibility. Use >= only for packages where
# minor updates are safe. Generate lock_file for full pinning.
dependencies:
  system:
    - build-essential
    - cmake
    - python3-pip
    - python3-colcon-common-extensions
  ros:
    - joint-state-publisher
    - robot-state-publisher
    - xacro
    - rosbridge-server
    - ros2-controllers
    - ros2-control
  pip:
    - mujoco==3.1.6
    - numpy==1.26.4
  rosdep: true                         # Run rosdep install after clone
  lock_file: ".oorb/pip.lock"          # Generated — exact pip versions
  # docker_digest: "sha256:..."        # Pin exact base image (optional)

# ─── Workspace Packages ───
# Declares all ROS 2 packages in the workspace, their roles, and relationships.
# Role types: description | msgs | bringup | control | perception | navigation | custom
packages:
  - name: "my_bot_description"
    path: "ros2_ws/src/my_bot_description"
    role: "description"
    description: "URDF/XACRO robot model, meshes, and robot_state_publisher launch"

  - name: "my_bot_bringup"
    path: "ros2_ws/src/my_bot_bringup"
    role: "bringup"
    description: "Launch files and parameter configs for sim and hardware profiles"

  - name: "my_bot_py"
    path: "ros2_ws/src/my_bot_py"
    role: "control"
    description: "Application nodes — joint publisher, MuJoCo sim, position control"

  # - name: "my_bot_msgs"
  #   path: "ros2_ws/src/my_bot_msgs"
  #   role: "msgs"
  #   description: "Custom messages, services, and actions"

# ─── Robot Model ───
# URDF is the source of truth. MuJoCo/Gazebo scenes are derived.
robot_model:
  source: "urdf"                       # urdf | mjcf
  urdf: "ros2_ws/src/my_bot_description/urdf/robot_arm.urdf.xacro"
  meshes: "ros2_ws/src/my_bot_description/meshes"
  auto_convert:
    mjcf: true                         # Auto-generate MJCF from URDF on build

# ─── Simulation ───
sim:
  engine: "mujoco"                     # mujoco | gazebo | none
  default_scene: "sim/models/mjcf/robot_arm.xml"
  settings:
    timestep: 0.002
    integrator: "RK4"

# ─── ROS Interfaces ───
# Declares all topics, services, and transforms the robot uses.
# Studio uses this to auto-generate topic monitors, visualizers, and TF tree views.
interfaces:
  sensors:
    - name: "Joint States"
      topic: "/joint_states"
      type: "sensor_msgs/JointState"
      hz: 20
      description: "Joint positions, velocities, efforts for 4 joints"
    # - name: "RGB Camera"
    #   topic: "/camera/image_raw"
    #   type: "sensor_msgs/Image"
    #   hz: 30
    #   frame_id: "camera_link"
    # - name: "IMU"
    #   topic: "/imu/data"
    #   type: "sensor_msgs/Imu"
    #   hz: 100
    #   frame_id: "imu_link"
    # - name: "Lidar"
    #   topic: "/scan"
    #   type: "sensor_msgs/LaserScan"
    #   hz: 10
    #   frame_id: "lidar_link"

  actuators:
    - name: "Position Controller"
      topic: "/position_controller/commands"
      type: "std_msgs/Float64MultiArray"
      description: "Target joint positions (4 floats in radians)"

  heartbeat:
    - name: "Chatter"
      topic: "/chatter"
      type: "std_msgs/String"
      hz: 2

  transforms:
    - parent: "base_link"
      child: "link1"
    - parent: "link1"
      child: "link2"
    - parent: "link2"
      child: "link3"
    - parent: "link3"
      child: "link4"

# ─── Sim / Hardware Profiles ───
# Each profile defines a launch configuration for a specific deployment target.
# Studio shows a profile selector in the workspace UI.
profiles:
  sim:
    launch: "ros2 launch my_bot_bringup sim.launch.py"
    params: "ros2_ws/src/my_bot_bringup/config/sim_params.yaml"
    hardware_required: false
    description: "Full MuJoCo simulation — no hardware needed"

  # hardware:
  #   launch: "ros2 launch my_bot_bringup hardware.launch.py"
  #   params: "ros2_ws/src/my_bot_bringup/config/hardware_params.yaml"
  #   hardware_required: true
  #   connection:
  #     method: "rosbridge"            # rosbridge | micro-ros | serial | ssh
  #     instructions: "docs/hardware_setup.md"
  #   description: "Physical robot — requires servo motors and MCU"

# ─── Safety Constraints ───
# Operational limits enforced at runtime. Tighter than URDF mechanical limits.
# Studio displays these in the workspace and the agent uses them for validation.
safety:
  joint_limits:
    joint_base:
      position: [-3.14, 3.14]         # rad (mechanical: ±180°)
      velocity: 2.0                    # rad/s max
    joint_shoulder:
      position: [-1.57, 1.57]         # rad (mechanical: ±90°)
      velocity: 1.5
    joint_elbow:
      position: [-2.36, 0.0]          # rad (mechanical: -135° to 0°)
      velocity: 1.5
    joint_wrist:
      position: [-1.57, 1.57]         # rad (mechanical: ±90°)
      velocity: 2.0
  workspace_bounds:                    # Cartesian workspace envelope (meters)
    x: [-0.6, 0.6]
    y: [-0.6, 0.6]
    z: [0.0, 0.9]
  emergency_stop_topic: "/e_stop"
  # max_force_n: 50                   # Max end-effector force (optional)
  # collision_check: true             # Enable self-collision checking (optional)

# ─── Assets ───
assets:
  uploads: "fab/uploads"               # Studio upload landing zone
  sim_models: "sim/models/mjcf"        # MuJoCo scene directory
  cad: "fab"                           # CAD root (STEP, STL, URDF source files)

# ─── Recording ───
# Defines what to record during workspace sessions.
# Studio adds a "Record" button that knows which topics matter for this project.
recording:
  default_topics:
    - "/joint_states"
    - "/tf"
    - "/position_controller/commands"
  storage: ".oorb/state/bags"
  max_duration: "5m"
  format: "mcap"                       # mcap | db3

# ─── What to run on workspace start ───
on_start:
  - name: "Build"
    command: >
      cd /workspace/ros2_ws &&
      source /opt/ros/jazzy/setup.bash &&
      colcon build --symlink-install &&
      source install/setup.bash
    terminal: "build"

  - name: "Launch sim"
    command: >
      source /opt/ros/jazzy/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 launch my_bot_bringup sim.launch.py
    terminal: "ros"
    wait_for: "Build"

# ─── Runbook ───
runbook:
  - step: "Build the workspace"
    detail: "colcon build --symlink-install in ros2_ws/"
    verify: "Exit code 0, no errors"
  - step: "Launch the sim profile"
    detail: "ros2 launch my_bot_bringup sim.launch.py"
    verify: "/joint_states publishing, MuJoCo tab loads arm model"
  - step: "Send position commands"
    detail: >
      ros2 topic pub /position_controller/commands
      std_msgs/msg/Float64MultiArray '{data: [0.5, 0.3, -0.8, 0.2]}'
    verify: "Arm moves to target position in sim"
  - step: "Record a bag"
    detail: "Use Studio Record button or: ros2 bag record /joint_states /tf -o test_bag --storage mcap"
    verify: "Bag file created in .oorb/state/bags/"

# ─── Benchmarks ───
# Performance tests that Studio can run and display as badges on the listing page.
benchmarks:
  - name: "Sim step rate"
    command: "python3 scripts/benchmark_sim.py"
    metric: "steps_per_second"
    expected: ">500"
  - name: "Control loop latency"
    command: "python3 scripts/benchmark_control.py"
    metric: "p99_ms"
    expected: "<20"
  - name: "Build time"
    command: "cd /workspace/ros2_ws && colcon build --symlink-install 2>&1 | tail -1"
    metric: "seconds"
    expected: "<60"

# ─── Training / RL Pipeline (optional — for advanced Blueprints) ───
# training:
#   framework: "stable-baselines3"     # stable-baselines3 | cleanrl | custom
#   env: "scripts/train_env.py"        # Gym/Gymnasium environment definition
#   config: "config/training.yaml"     # Hyperparameters
#   checkpoints: "rl_models/"          # Saved model weights
#   reward_function: "scripts/reward.py"
#   tensorboard_log: "logs/tensorboard/"
#   eval_episodes: 100                 # Episodes for evaluation
#   on_train_complete:                 # What to do after training finishes
#     - "python3 scripts/export_policy.py"

# ─── Workspace State ───
state:
  conversations: ".oorb/state/conversations"
  logs: ".oorb/state/logs"
  outputs: ".oorb/state/outputs"
  bags: ".oorb/state/bags"
  restore_on_import: true

# ─── CI/CD ───
ci:
  pipeline: ".github/workflows/blueprint-ci.yaml"
  badge: true                          # Show CI status badge on listing page

