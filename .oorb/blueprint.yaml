# .oorb/blueprint.yaml — OORB Studio Blueprint Manifest v1
#
# This file is what makes a repo a Blueprint.
# Studio reads it on import. Local users read it for setup context.
# Everything else in the repo is standard ROS 2 / robotics project files.

oorb_blueprint: "1.0"

# ─── What is this project? ───
# Technical identity only. All marketplace display content lives in listing.yaml.
meta:
  name: "4-DOF Robot Arm"
  slug: "4dof-robot-arm"
  version: "0.1.0"
  license: "MIT"
  ros_distro: "jazzy"
  robot_type: "arm"                # mobile_base | quadruped | arm | drone | custom

# ─── Marketplace Listing ───
# The listing file is the single source of truth for how this Blueprint appears
# on its page at oorb.io/blueprints/<slug>. Users can edit it directly or via
# the Studio UI editor — both produce the same result.
listing: ".oorb/listing.yaml"

# ─── Container resources ───
resources:
  cpu: 2
  ram_gb: 4
  storage_gb: 10
  gpu: false

# ─── What to install ───
dependencies:
  system:
    - build-essential
    - cmake
    - python3-pip
    - python3-colcon-common-extensions
  ros:
    - joint-state-publisher
    - robot-state-publisher
    - xacro
    - rosbridge-server
  pip:
    - mujoco>=3.0
    - numpy

# ─── Simulation ───
sim:
  engine: "mujoco"
  default_scene: "sim/models/mjcf/robot_arm.xml"

# ─── Assets ───
# fab/uploads/ is where Studio puts user-uploaded files (URDF, meshes, STEP, etc.)
# Studio knows to read from here when publishing/updating a Blueprint.
# sim/models/mjcf/ is where MuJoCo scenes live (can reference meshes in fab/uploads/).
assets:
  uploads: "fab/uploads"             # Studio upload landing zone
  sim_models: "sim/models/mjcf"      # MuJoCo scene directory
  cad: "fab"                         # CAD root (STEP, STL, URDF source files)

# ─── What to run on workspace start ───
on_start:
  - name: "Build"
    command: >
      cd /workspace/ros2_ws &&
      source /opt/ros/jazzy/setup.bash &&
      colcon build --symlink-install &&
      source install/setup.bash
    terminal: "build"

  - name: "Run robot arm demo"
    command: >
      source /opt/ros/jazzy/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 run my_bot_py robot_arm
    terminal: "ros"
    wait_for: "Build"

# ─── Runbook (shows in agent PLAN tab as actionable steps) ───
runbook:
  - step: "Build the workspace"
    detail: "colcon build --symlink-install in ros2_ws/"
    verify: "Exit code 0, no errors"
  - step: "Run the robot arm publisher"
    detail: "ros2 run my_bot_py robot_arm"
    verify: "/joint_states publishing at 20 Hz"
  - step: "Watch in sim"
    detail: "MuJoCo tab loads robot_arm.xml automatically"
    verify: "Arm moves with sinusoidal joint motion"
  - step: "Send your own commands"
    detail: "ros2 topic pub /position_controller/commands std_msgs/Float64MultiArray '{data: [0.5, 0.3, -0.8, 0.2]}'"
    verify: "Arm moves to the target position"

# ─── Workspace State ───
# When a user pushes/publishes a Blueprint, Studio can include the workspace
# state so that anyone who imports it gets the full context — not just the code,
# but the conversations, logs, and outputs from the original workspace.
# This is what makes Blueprints a "workspace snapshot" not just a template.
state:
  conversations: ".oorb/state/conversations"   # Agent chat threads (JSONL)
  logs: ".oorb/state/logs"                     # Terminal/build/ROS output logs
  outputs: ".oorb/state/outputs"               # Generated artifacts (plots, data, recordings)
  restore_on_import: true                      # Reload into Studio UI on import

# Conversation format: one .jsonl file per thread
# Each line: {"role": "user|agent|system", "content": "...", "timestamp": "ISO8601"}
# File naming: NNN_topic-slug.jsonl (e.g. 001_initial-setup.jsonl)
#
# Log format: plain text with timestamps, one file per terminal/source
# File naming: <terminal-name>.log (e.g. build.log, ros.log)
#
# Outputs: any files generated during the session (plots, CSVs, rosbags, etc.)

