[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-engine"
version = "0.1.0"
description = "Optimized inference engine for vision-language-action models (OpenVLA, pi0, SmolVLA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["robotics", "vla", "openvla", "pi0", "smolvla", "inference", "ros2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core stays tiny on purpose: the types, config, registry, control loop,
# and wire protocol must import on a robot or a CI runner with no GPU.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Model execution. torch is not pinned to a CUDA build here -- install the
# wheel matching your driver first (cu121 or newer for Ampere).
cuda = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.33",
    "pillow>=10.0",
]
# LeRobot policies (pi0, SmolVLA).
lerobot = ["lerobot>=0.1.0"]
# 4-bit / 8-bit weight quantization.
quant = ["bitsandbytes>=0.43"]
# FlashAttention-2. Needs a compiler; --no-build-isolation is usually required.
flash = ["flash-attn>=2.5"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pillow>=10.0"]
client = ["websockets>=12.0", "pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "pillow>=10.0"]
# Everything except flash-attn, which needs a compiler at install time.
all = [
    "vla-engine[cuda,lerobot,quant,serve,client]",
]

[project.scripts]
vla = "vla_engine.cli:main"

[project.urls]
Homepage = "https://oorb.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "gpu: requires a CUDA device",
    "weights: downloads model weights",
]
# The suite drives asyncio with asyncio.run() rather than async fixtures;
# setting this silences pytest-asyncio's unset-default warning.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]
